model:
  variant: "rmt_seg_small"
  in_channels: 5
  num_classes: 20
  embed_dim: 64
  num_stages: 3
  num_blocks: [1, 1, 1]
  window_size: 7
  num_heads: 8
  mamba_d_state: 16
  mamba_expand: 2
  mlp_ratio: 4.0
  use_mamba_ssm: false
  gate_v2: false
  attn_drop: 0.0
  proj_drop: 0.0
  drop_path_rate: 0.1
  head_dropout: 0.1
  stem_stride: 1
  stem_skip: true
  adaptive_window: false
  window_keep_ratio: 0.7

data:
  data_root: "./data/SemanticKITTI"
  batch_size: 8
  num_workers: 4
  h: 64
  w: 2048
  fov_up: 3.0
  fov_down: -25.0
  augment: true
  flip_prob: 0.5
  noise_std: 0.02

reliability:
  alpha: 0.02
  tau: 0.1
  beta: 0.5
  smooth_sigma: 1.0

loss:
  lambda_rel: 1.0
  lambda_ref: 0.0
  ref_mode: "mse"
  label_smoothing: 0.0
  class_weight: null

train:
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  scheduler: "cosine"
  warmup_epochs: 5
  min_lr: 1.0e-6
  step_size: 30
  step_gamma: 0.1
  plateau_patience: 10
  grad_clip: 1.0
  amp: true
  ema_decay: 0.0
  log_interval: 50
  val_interval: 1

checkpoint:
  save_dir: "./checkpoints"
  save_best: true
  resume: null
